[package]
name = "offora"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lib]
path = "src/offora.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
