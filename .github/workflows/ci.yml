name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: bash scripts/check.sh
      - run: bash scripts/smoke.sh
        env:
          APP_VERSION: ${{ github.sha }}
      - run: docker save "offora:$GITHUB_SHA" | gzip > offora.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ github.sha }}
          path: offora.tar.gz
          retention-days: 7
