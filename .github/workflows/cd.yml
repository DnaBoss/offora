name: Deploy
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: offora-release
  cancel-in-progress: false
env:
  AWS_REGION: ap-northeast-1
  DEPLOY_ROLE: arn:aws:iam::468830732232:role/github-deploy-essence
  INSTANCE_ID: i-0af422c38ade0c972
  BUCKET: essence-deploy-468830732232
  PUBLIC_URL: https://offora.exactlyone.dev
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws s3 cp offora.tar.gz "s3://$BUCKET/offora/offora-$GITHUB_SHA.tar.gz" --only-show-errors
      - name: Roll out on the instance
        run: |
          set -euo pipefail
          commands=$(jq -cn --arg sha "$GITHUB_SHA" --arg bucket "$BUCKET" --arg region "$AWS_REGION" '[
            "set -e",
            "cd /opt/offora",
            "aws s3 cp s3://\($bucket)/offora/offora-\($sha).tar.gz /tmp/o.tgz --region \($region) --only-show-errors",
            "docker load -i /tmp/o.tgz | tail -1",
            "sed -i \"s/^APP_VERSION=.*/APP_VERSION=\($sha)/\" .env",
            "docker compose -p offora up -d --no-build --wait --remove-orphans 2>&1 | tail -3",
            "curl -fs http://127.0.0.1:18780/version"
          ]')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "offora $GITHUB_SHA" --parameters "{\"commands\":$commands}" --query Command.CommandId --output text)
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          test "$status" = Success
      - name: Confirm the public version
        run: |
          for _ in $(seq 1 12); do
            version=$(curl -fs "$PUBLIC_URL/version" | jq -r .version || true)
            [ "$version" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          echo "公開版本是 $version，預期 $GITHUB_SHA"
          exit 1
