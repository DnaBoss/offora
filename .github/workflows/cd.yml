name: Prepare deployment artifact
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offora-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ github.sha }}
      - run: docker load --input offora.tar.gz
      - run: docker image inspect "offora:$GITHUB_SHA" --format '{{.Id}}' > image-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: offora-${{ github.sha }}
          path: |
            offora.tar.gz
            image-id.txt
          retention-days: 7
